name: Argon2id WASM dedicated Worker compatibility

on:
  push:
    branches:
      - design/cyber-visual-architecture
    paths:
      - "security/argon2-wasm/**"
      - "tools/argon2id-browser-spike/**"
      - "scripts/package-argon2-wasm-assets.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
      - ".github/workflows/argon2-wasm-worker-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm-worker-browser:
    name: Rust Argon2id WASM inside Chromium, Firefox, and WebKit Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path security/argon2-wasm/Cargo.toml -- --check

      - name: Run Rust unit tests and RFC 9106 vector
        run: cargo test --manifest-path security/argon2-wasm/Cargo.toml

      - name: Compile release WASM module
        run: cargo build --manifest-path security/argon2-wasm/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Generate browser-target ES module bindings
        run: |
          wasm-bindgen \
            --target web \
            --out-dir security/argon2-wasm/pkg-web \
            --out-name vault_argon2_wasm_poc \
            security/argon2-wasm/target/wasm32-unknown-unknown/release/vault_argon2_wasm_poc.wasm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Package generated browser WASM assets into the Next.js public tree
        run: npm run package:argon2-wasm

      - name: Build OpenNext Cloudflare output with packaged WASM assets
        run: npm run build:cloudflare

      - name: Verify WASM assets are present in the OpenNext asset output
        run: |
          test -s .open-next/assets/crypto/argon2/vault_argon2_wasm_poc.js
          test -s .open-next/assets/crypto/argon2/vault_argon2_wasm_poc_bg.wasm
          test -s .open-next/assets/crypto/argon2/manifest.json
          node -e 'const fs=require("fs");const p=".open-next/assets/crypto/argon2/manifest.json";const m=JSON.parse(fs.readFileSync(p,"utf8"));if(m.format!=="vault-argon2-wasm-assets"||m.files.length!==3)process.exit(1);console.log("OpenNext packaged WASM manifest verified:",m.files.map(x=>x.path).join(", "));'

      - name: Install isolated Playwright dependencies
        working-directory: tools/argon2id-browser-spike
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Install Chromium, Firefox, and WebKit
        working-directory: tools/argon2id-browser-spike
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Rust Argon2id WASM inside dedicated browser Workers
        working-directory: tools/argon2id-browser-spike
        run: node run-rust-wasm-worker-test.mjs

      - name: Upload browser-target WASM and generated glue for inspection
        uses: actions/upload-artifact@v4
        with:
          name: argon2id-web-worker-poc-${{ github.sha }}
          path: |
            security/argon2-wasm/pkg-web/
            .open-next/assets/crypto/argon2/
          if-no-files-found: error
          retention-days: 7
