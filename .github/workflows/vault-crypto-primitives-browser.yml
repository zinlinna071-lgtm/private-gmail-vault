name: Vault Web Crypto browser compatibility

on:
  push:
    branches:
      - design/cyber-visual-architecture
    paths:
      - "tools/crypto-primitives-spike/**"
      - "tools/argon2id-browser-spike/package.json"
      - "tools/argon2id-browser-spike/run-crypto-primitives-browser-test.mjs"
      - ".github/workflows/vault-crypto-primitives-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webcrypto-browser-matrix:
    name: HKDF and AES-256-GCM in Chromium, Firefox, WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/argon2id-browser-spike
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing isolated browser-test tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install supported browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run public Web Crypto vectors in each browser engine
        run: node run-crypto-primitives-browser-test.mjs
