[package]
name = "vault-argon2-wasm-poc"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated RustCrypto Argon2id browser-WASM proof of concept"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
